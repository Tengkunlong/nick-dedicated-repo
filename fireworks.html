<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nick 的专用库 · 烟花</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #050914 0%, #0a1230 55%, #131c42 100%);
    min-height: 100vh;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #eef2ff;
    user-select: none;
    -webkit-user-select: none;
  }
  #sky { position: fixed; inset: 0; display: block; touch-action: none; }
  .panel {
    position: fixed; left: 0; right: 0; top: 8vh;
    text-align: center; pointer-events: none; z-index: 2;
  }
  .panel h1 {
    font-size: clamp(26px, 6vw, 44px); letter-spacing: .12em; font-weight: 700;
    text-shadow: 0 0 24px rgba(140,170,255,.65);
  }
  .panel p { margin-top: 10px; font-size: clamp(13px, 3.4vw, 16px); color: #aebadd; letter-spacing: .2em; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 5vh; z-index: 2;
    display: flex; justify-content: center; gap: 12px;
  }
  .bar button {
    pointer-events: auto; cursor: pointer;
    background: rgba(120,150,255,.14); color: #eef2ff;
    border: 1px solid rgba(160,180,255,.45); border-radius: 999px;
    padding: 10px 22px; font-size: 15px; letter-spacing: .1em;
    backdrop-filter: blur(6px);
  }
  .bar button:active { transform: scale(.96); background: rgba(120,150,255,.3); }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 1.6vh; z-index: 2;
    text-align: center; font-size: 12px; color: #7787b5; letter-spacing: .15em; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="panel">
  <h1>Nick 的专用库</h1>
  <p>第一份代码 · Muse 现场写就</p>
</div>
<div class="bar">
  <button id="launchBtn" type="button">再放一发</button>
  <button id="finaleBtn" type="button">来个 finale</button>
</div>
<div class="hint">点一下夜空也能放烟花</div>
<script>
(function () {
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');
  var W, H, stars = [], rockets = [], sparks = [];
  var DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = [];
    for (var i = 0; i < 130; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H * 0.75,
                   r: Math.random() * 1.3 + 0.3, tw: Math.random() * Math.PI * 2 });
    }
  }
  window.addEventListener('resize', resize);
  resize();

  var PALETTES = [
    [45, 100], [200, 95], [280, 90], [330, 95], [130, 80], [20, 100], [175, 85]
  ];

  function launch(x) {
    var targetY = H * (0.16 + Math.random() * 0.3);
    rockets.push({
      x: (typeof x === 'number') ? x : (W * 0.15 + Math.random() * W * 0.7),
      y: H + 6,
      vy: -(H * 0.011 + Math.random() * H * 0.004),
      targetY: targetY,
      hue: PALETTES[Math.floor(Math.random() * PALETTES.length)]
    });
  }

  function explode(x, y, hue) {
    var count = 90 + Math.floor(Math.random() * 50);
    var ring = Math.random() < 0.35;
    for (var i = 0; i < count; i++) {
      var angle = (Math.PI * 2 * i) / count + (ring ? 0 : Math.random() * 0.3);
      var speed = ring ? 4.6 + Math.random() * 0.7
                       : 1.2 + Math.random() * 4.6;
      sparks.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.006 + Math.random() * 0.01,
        hue: hue[0] + (Math.random() * 24 - 12), sat: hue[1],
        size: 1.4 + Math.random() * 1.8
      });
    }
  }

  var tick = 0;
  function frame() {
    tick++;
    ctx.fillStyle = 'rgba(6, 10, 26, 0.22)';
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var a = 0.35 + 0.3 * Math.sin(tick * 0.03 + s.tw);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#dfe8ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var r = rockets.length - 1; r >= 0; r--) {
      var rk = rockets[r];
      rk.y += rk.vy; rk.vy += 0.045;
      ctx.strokeStyle = 'hsla(' + rk.hue[0] + ', ' + rk.hue[1] + '%, 75%, 0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(rk.x, rk.y + 14); ctx.lineTo(rk.x, rk.y); ctx.stroke();
      if (rk.y <= rk.targetY || rk.vy >= -1) {
        explode(rk.x, rk.y, rk.hue);
        rockets.splice(r, 1);
      }
    }

    for (var p = sparks.length - 1; p >= 0; p--) {
      var sp = sparks[p];
      sp.x += sp.vx; sp.y += sp.vy;
      sp.vx *= 0.985; sp.vy = sp.vy * 0.985 + 0.035;
      sp.life -= sp.decay;
      if (sp.life <= 0) { sparks.splice(p, 1); continue; }
      ctx.globalAlpha = Math.max(sp.life, 0);
      ctx.fillStyle = 'hsl(' + sp.hue + ', ' + sp.sat + '%, ' + (55 + sp.life * 20) + '%)';
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.size * sp.life + 0.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (tick % 50 === 0 && rockets.length < 3 && Math.random() < 0.75) launch();
    requestAnimationFrame(frame);
  }
  frame();

  setTimeout(function () { launch(W * 0.3); }, 350);
  setTimeout(function () { launch(W * 0.55); }, 800);
  setTimeout(function () { launch(W * 0.75); }, 1250);

  function pointLaunch(e) {
    var t = (e.touches && e.touches[0]) || e;
    launch(t.clientX);
  }
  canvas.addEventListener('click', pointLaunch);
  canvas.addEventListener('touchstart', pointLaunch, { passive: true });

  document.getElementById('launchBtn').addEventListener('click', function () { launch(); });
  document.getElementById('finaleBtn').addEventListener('click', function () {
    for (var i = 0; i < 6; i++) {
      (function (k) { setTimeout(function () { launch(W * (0.15 + 0.14 * k)); }, k * 160); })(i);
    }
  });
})();
</script>
</body>
</html>
